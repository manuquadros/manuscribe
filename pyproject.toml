[project]
name = "manuscribe"
version = "0.1.0"
description = "PDF parser used to convert PDFs for the D3 Annotation Hub"
authors = [{ name = "Emanuel Quadros", email = "emanuel.quadros@dsmz.de" }]
readme = "README.md"
requires-python = "<3.14,>=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "httpx",
  "pypdfium2",
  "pillow",
  "markdown-it-py>=3",
  "pylatexenc>=2.10",
  "pyspellchecker>=0.9.0",
  "numpy>=2.5.2",
  "nh3>=0.3.7",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
  "beartype>=0.21",
  "ruff>=0.9",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-sugar>=1",
  "pytest-asyncio>=1",
  "pre-commit>=4",
  "sphinx>=8",
  "pydata-sphinx-theme>=0.16",
  "sphinx-autodoc-typehints>=3",
  "sphinx-autobuild>=2024",
  "ipython-autotime>=0.3.2",
  "starlette>=1.0.1",
]

[tool.pdm.scripts]
to-html = "python -m manuscribe"
test = "pytest"
test-cov = "pytest --cov=manuscribe --cov-report=term-missing"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "mypy src"
lock-check-python = "python scripts/check_lock_python_target.py"
# API stubs are generated by the sphinx.ext.apidoc extension during the build
# (configured in docs/conf.py), so a plain sphinx-build covers both this and
# docs-serve.
docs-build = "sphinx-build -n -W --keep-going docs docs/_build/html"
docs-serve = "sphinx-autobuild -n docs docs/_build/html --open-browser"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["manuscribe"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# pypdfium2 ships no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/manuscribe"]
branch = true

[tool.coverage.report]
show_missing = true
